name: Render Kindle dashboard
on:
  schedule:
    - cron: '5 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['render.py']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Render dashboard PNG
        run: python render.py --out dashboard.png
      - name: Commit and push if changed
        run: |
          git config user.name "kindle-dashboard-bot"
          git config user.email "kindle-dashboard-bot@users.noreply.github.com"
          git add dashboard.png
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "dashboard $(date +%F)"
            git push
          fi
